<!doctype html><meta charset="utf-8"><title>Synthetic capture fixture</title>
<style>body{margin:0;background:#eef3f8;font:20px system-ui;color:#152a40}header{position:sticky;top:0;background:#124d8c;color:white;padding:30px}main{padding:30px}input{font:inherit;padding:10px;width:80%}.block{height:500px;margin:30px 0;background:#dbe6ef;padding:20px}#pixel{position:fixed;top:0;left:0;width:20px;height:20px;background:rgb(20,100,180);z-index:3}</style>
<div id="pixel"></div><header><small>LOCAL SYNTHETIC FIXTURE</small><h1>Capture <span id="marker">0</span></h1></header><main><label>Unsaved draft <input id="draft" value="unsubmitted sample"></label><div class="block">Section 1</div><div class="block">Section 2</div><div class="block">Section 3</div></main>
<script>sessionStorage.setItem('capture-test',sessionStorage.getItem('capture-test')||crypto.randomUUID());window.setMarker=n=>{document.querySelector('#marker').textContent=n;document.querySelector('#pixel').style.background=`rgb(${20+n*10},100,180)`;return n};window.probe=()=>({marker:document.querySelector('#marker').textContent,draft:document.querySelector('#draft').value,session:sessionStorage.getItem('capture-test'),timeOrigin:performance.timeOrigin,scrollY:scrollY,width:innerWidth,height:innerHeight,dpr:devicePixelRatio});</script>
