<!doctype html><meta charset="utf-8"><title>Background capture repro</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;color:#192e43;background:transparent;overflow:hidden}#surface{position:relative;z-index:0;background:#f5f7fa;padding:26px}h1{font-size:24px;line-height:1.2;margin:9px 0 22px}small{font-weight:700;letter-spacing:1px;color:#607182;font-size:11px}dl{margin:0;border-top:1px solid #d7e0e7}dl div{display:flex;gap:16px;justify-content:space-between;border-bottom:1px solid #d7e0e7;padding:12px 0}dt{color:#536477;font-size:14px}dd{margin:0;font-size:14px;font-weight:650;text-align:right}#result{margin-top:20px;color:#9b4f05;line-height:1.45;font-size:14px}#result.pass{color:#196c44}#image{display:none;width:440px;height:200px;margin:16px auto 0;border-radius:5px}footer{margin-top:18px;font-size:11px;color:#637789}webview{position:absolute;left:0;top:0;width:440px;height:200px;visibility:visible;z-index:-1}
</style>
<webview id="guest" src="./fixture.html"></webview>
<main id="surface"><small>ISOLATED ELECTRON TEST · LOCAL FIXTURE</small><h1 id="heading">Preparing test…</h1><dl id="stats"></dl><div id="result"></div><img id="image" alt="Actual returned screenshot of the synthetic test page"><footer>No login, external sites or application data.</footer></main>
<script>
window.report = ({heading, rows, note, image, pass}) => {
 document.querySelector('#heading').textContent=heading;
 const stats=document.querySelector('#stats');stats.replaceChildren();
 for(const [label,value] of rows){const row=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;row.append(dt,dd);stats.append(row);}
 const result=document.querySelector('#result');result.textContent=note;result.className=pass?'pass':'';
 const img=document.querySelector('#image');img.style.display=image?'block':'none';if(image)img.src=image;
};
</script>
